<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>People Counter</title>
  <style>
    body{font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;margin:0;padding:16px;background:#0b0b0b;color:#fff}
    .card{max-width:900px;margin:0 auto;background:#151515;padding:16px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
    img{width:100%;border-radius:12px}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    .pill{padding:6px 10px;background:#222;border-radius:999px}
  </style>
</head>
<body>
  <div class="card">
    <h1>People Counter</h1>
    <div class="row">
      <span class="pill">Flask</span>
      <span class="pill">OpenCV</span>
      <span class="pill">YOLOv8</span>
    </div>
    <img src="/stream" alt="stream" />
    <p>Tip: Rotate phone to landscape for better view.</p>
  </div>
</body>
</html>
